<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>End Task</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;color:#333;background:#f5f5f5;min-width:400px;max-width:400px;max-height:600px}
    .container{display:flex;flex-direction:column;min-height:200px;max-height:600px}
    .header{padding:16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0}
    .title{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
    .subtitle{font-size:12px;color:#666}
    .loading-state{padding:24px;text-align:center;color:#888;font-size:13px}
    .tab-list{flex:1;overflow-y:auto;padding:8px;max-height:450px}
    .hidden{display:none!important}
  </style>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">End Task</h1>
      <p class="subtitle">選擇分頁並終止其 process 以釋放資源</p>
      <div class="auto-end-settings">
        <div class="auto-end-top-row">
          <label class="auto-end-toggle">
            <input type="checkbox" id="auto-end-enabled" />
            <span>啟用自動 End Task</span>
          </label>
          <div id="batch-actions" class="batch-actions hidden">
            <button id="end-task-all" class="end-task-all-btn">End Task All</button>
            <button id="restore-all" class="restore-all-btn">Restore All</button>
          </div>
        </div>
        <div class="auto-end-input-row">
          <label for="auto-end-minutes">預設閒置</label>
          <input type="number" id="auto-end-minutes" min="1" max="120" value="15" />
          <span class="auto-end-unit">分鐘</span>
        </div>
      </div>
      <div class="rules-section">
        <div class="rules-header">
          <span class="rules-title">自動 End Task 規則</span>
          <button type="button" id="rules-toggle" class="rules-toggle" aria-expanded="false">展開</button>
        </div>
        <div id="rules-content" class="rules-content hidden">
          <p class="rules-hint">站點規則只影響自動 End Task；單一分頁請直接在分頁列點選 Never Close。</p>
          <div class="rule-form-row">
            <select id="rule-match-type" class="rule-select">
              <option value="domain">Domain</option>
              <option value="fqdn">FQDN</option>
              <option value="url">URL</option>
            </select>
            <input id="rule-pattern" class="rule-input" type="text" placeholder="example.com / mail.example.com / https://example.com/page" />
          </div>
          <div class="rule-form-row">
            <select id="rule-mode" class="rule-select">
              <option value="never">Never Close</option>
              <option value="idle">Auto End After</option>
            </select>
            <div id="rule-idle-group" class="rule-idle-group hidden">
              <input type="number" id="rule-idle-minutes" min="1" max="120" value="15" />
              <span class="rule-idle-unit">分鐘</span>
            </div>
            <button type="button" id="rule-add" class="rule-add-btn">儲存規則</button>
          </div>
          <ul id="rule-list" class="rule-list"></ul>
        </div>
      </div>
    </header>

    <div id="error-message" class="error-message hidden">chrome.processes API 不支援。請使用 Chrome Dev channel。</div>

    <div id="empty-state" class="empty-state hidden">
      目前沒有可操作的分頁。
    </div>

    <div id="tab-list" class="tab-list"></div>

    <footer class="footer">
      <span id="shortcut-display" class="shortcut-hint">快捷鍵：載入中...</span>
      <button id="open-shortcut-settings" class="settings-btn">設定快捷鍵</button>
    </footer>
  </div>
  <script src="auto-end-rules.js"></script>
  <script src="prefix-tab-title.js"></script>
  <script src="popup.js"></script>
</body>
</html>
